name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependências (gera também os contratos fictícios)
        run: npm install

      - name: Vitest com cobertura
        run: npm run test:coverage

      - name: Avaliação do agente (taxa de acerto contra o gabarito)
        run: npm run avaliar

      - name: Subir o servidor
        run: |
          npm start > servidor.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/saude && exit 0
            sleep 1
          done
          cat servidor.log
          exit 1

      - name: Cypress (API e tela)
        run: npx cypress run --browser chrome

      - name: Guardar prints dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prints-das-falhas
          path: |
            cypress/screenshots
            servidor.log
          if-no-files-found: ignore
